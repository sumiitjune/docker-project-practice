<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>URL Health Monitor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
    }

    .up {
      color: #22c55e;
    }

    .down {
      color: #ef4444;
    }

    .loading {
      color: #facc15;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🌐 URL Monitor</h1>

    <input id="url" placeholder="https://example.com">
    <br>
    <button onclick="check()">Check</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    function check() {
      const url = document.getElementById("url").value;
      const resultDiv = document.getElementById("result");

      resultDiv.innerHTML = "<span class='loading'>Checking...</span>";

      fetch("http://localhost:5001/check", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ url: url })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "UP") {
          resultDiv.innerHTML =
            `<span class="up">✅ UP</span><br>Time: ${data.response_time} ms`;
        } else {
          resultDiv.innerHTML =
            `<span class="down">❌ DOWN</span>`;
        }
      })
      .catch(err => {
        resultDiv.innerHTML =
          `<span class="down">Error connecting backend</span>`;
      });
    }
  </script>

</body>
</html>
